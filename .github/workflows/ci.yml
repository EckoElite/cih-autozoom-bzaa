name: CI

# Lint, run the whole test suite inside the image (the same ffmpeg that ships), smoke-test the runtime image, and on
# main or a version tag publish it to GHCR. Pull requests build and test but never publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "unraid/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "unraid/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements-dev.txt
      - run: pip install -r analyzer/requirements-dev.txt
      - run: ruff check analyzer
      - run: ruff format --check analyzer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test stage and run the suite inside it
        run: |
          docker build --target test -t cih-analyzer-test analyzer
          docker run --rm cih-analyzer-test
      - name: Build the runtime image and check that it starts, reports healthy and runs as 99:100
        run: |
          docker build --target runtime -t cih-analyzer:ci analyzer
          mkdir -p "$RUNNER_TEMP/media"
          docker run -d --name smoke -p 8765:8765 -v "$RUNNER_TEMP/media:/media:ro" cih-analyzer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health | grep -q '"ok":true'
          test "$(docker exec smoke id -u):$(docker exec smoke id -g)" = "99:100"
          docker logs smoke
          docker rm -f smoke

  image:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs it lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cih-analyzer" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: analyzer
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
