name: zoomspike-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/spike/zoomspike-android/**'
      - '.github/workflows/zoomspike.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p tools/spike/zoomspike-android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zoomspike-debug-apk
          path: tools/spike/zoomspike-android/app/build/outputs/apk/debug/app-debug.apk
