[project]
name = "cih-analyzer"
version = "0.3.7"
description = "Offline aspect-ratio timeline analyzer for CIH Auto-Zoom"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "numpy==2.5.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
# `ruff format --check` owns code line length; prose lines in docstrings may run a little over
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S310", "S311", "S603", "S607"]
# the only interpolated SQL is a fixed column list and a fixed column name chosen from a constant tuple
"src/cih_analyzer/store.py" = ["S608"]
