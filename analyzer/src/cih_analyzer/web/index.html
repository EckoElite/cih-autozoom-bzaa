<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIH Analyzer</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5d6672; --card:#fff; --line:#d9dde3; --accent:#1c6ed5; --bad:#b3261e; --ok:#1d7a3a; --warn:#9a6700; --track:#e6e9ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161b; --fg:#e6e9ee; --muted:#9aa4b1; --card:#1a2028; --line:#2c343e; --accent:#6aa8ff; --bad:#ff8a80; --ok:#6fd68c; --warn:#e3b341; --track:#2a323c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 10px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin-bottom:8px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:6px 12px; }
  .card b { display:block; font-size:20px; } .muted { color:var(--muted); font-size:13px; }
  p { margin:6px 0; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 12px; min-height:36px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  input[type=search] { flex:1 1 220px; min-width:0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
  .banner { border:1px solid var(--warn); border-radius:6px; padding:8px 12px; color:var(--warn); margin:8px 0; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button.danger.armed { background:var(--bad); color:#fff; font-weight:600; }

  /* one entry per file, readable at any width: the name wraps, the folder sits under it, nothing is squeezed into columns */
  .list { display:flex; flex-direction:column; gap:8px; }
  .job { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .job.queued { padding:8px 12px; }
  .name { font-weight:600; overflow-wrap:anywhere; }
  .dir { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:4px; font-size:13px; color:var(--muted); }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:10px; padding:0 8px; font-size:12px; color:var(--muted); }
  .chip.demand { border-color:var(--accent); color:var(--accent); }
  .err { margin-top:4px; overflow-wrap:anywhere; font-size:13px; }
  .job .row { margin:8px 0 0; }

  /* progress */
  .track { height:10px; background:var(--track); border-radius:5px; overflow:hidden; margin-top:8px; }
  .fill { height:100%; background:var(--accent); border-radius:5px; transition:width .6s ease; }
  .fill.wait { width:35%; opacity:.5; animation:slide 1.4s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left:0; } to { margin-left:65%; } }
  @media (prefers-reduced-motion: reduce) { .fill.wait { animation:none; } .fill { transition:none; } }
  .ptext { display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; margin-top:4px; font-size:13px; }

  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  .bar { display:flex; height:34px; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin:8px 0; }
  .seg { display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; min-width:2px; overflow:hidden; white-space:nowrap; }
  .ramp { background:repeating-linear-gradient(45deg, #888, #888 4px, #bbb 4px, #bbb 8px); color:#000; }
  svg { width:100%; height:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  #dtitle { overflow-wrap:anywhere; }
  #note { min-height:1.4em; }

  @media (max-width: 640px) {
    main { padding:10px; }
    section { padding:10px 12px; }
    .cards { grid-template-columns:repeat(3, 1fr); }
    button, select, input { min-height:44px; }
    .row > button { flex:1 1 auto; }
    #workers { width:5em; }
  }
</style>
</head>
<body>
<main>
  <h1>CIH Analyzer <span class="muted" id="ver"></span></h1>
  <div id="note" class="muted"></div>

  <section>
    <h2>Status</h2>
    <div class="cards" id="cards"></div>
    <p class="muted" id="sched"></p>
    <div class="row">
      <button id="pause" title="Start no new file. Files being analysed carry on and finish.">Pause</button><button id="resume">Resume</button>
      <button id="stop" class="danger" title="Kill the files being analysed. They go back in the queue and start over after Resume.">Stop now</button>
    </div>
    <p id="pausebanner" class="banner" hidden></p>
    <div class="row">
      <button id="scan">Scan media now</button><button id="plex">Sync Plex now</button>
    </div>
    <div class="row">
      <label>Files analysed at once <input type="number" id="workers" min="1" max="16" inputmode="numeric" style="width:4.5em"></label>
      <button id="setworkers">Apply</button><button id="resetworkers" title="Forget the saved count and use the CONCURRENCY setting from the container template">Use template setting</button>
    </div>
    <p class="muted" id="workershint">Raising it starts more now; lowering it lets running files finish and takes no new ones. To start nothing new, use Pause. Saved across restarts.</p>
  </section>

  <section>
    <h2>Running</h2>
    <div class="list" id="running"></div>
    <p class="muted" id="runningnone" hidden>Nothing is running.</p>
  </section>

  <section>
    <h2>Up next</h2>
    <div class="list" id="queue"></div>
    <p class="muted" id="more"></p>
  </section>

  <section>
    <h2>Errors</h2>
    <div class="list" id="errors"></div>
    <p class="muted" id="noerrors">None.</p>
  </section>

  <section>
    <h2>Titles</h2>
    <div class="row">
      <input type="search" id="q" placeholder="Search title or path">
      <button id="go">Search</button><button id="vars">Variable-ratio titles</button>
    </div>
    <div class="list" id="results"></div>
  </section>

  <section id="detail" hidden>
    <h2 id="dtitle"></h2>
    <div class="row">
      <button id="reanalyze">Analyze again</button>
      <label>Override <select id="ovmode"><option value="">none</option><option value="disable">disable zoom</option></select></label>
      <button id="ovsave">Save</button><span class="muted" id="ovnow"></span>
    </div>
    <div class="bar" id="bar"></div>
    <div class="scroll"><table id="segs"><thead><tr><th>From</th><th>To</th><th>Ratio</th><th>Picture (x y w h)</th><th>Enter</th></tr></thead><tbody></tbody></table></div>
    <div id="ramps"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let current = null;
let workersEdited = false;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function key() { try { return localStorage.getItem("cihKey") || ""; } catch (e) { return ""; } }
function saveKey(v) { try { localStorage.setItem("cihKey", v); } catch (e) { /* private window */ } }
// A message stays up for a few seconds, so the next automatic refresh cannot wipe it before it is read.
let noteUntil = 0;
function note(msg, cls, seconds) { const n = $("note"); n.textContent = msg; n.className = cls || "muted"; noteUntil = Date.now() + (seconds || 0) * 1000; }
function clearNote() { if (Date.now() >= noteUntil) note(""); }

async function api(path, opts) {
  const o = Object.assign({ headers: {} }, opts || {});
  if (key()) o.headers["X-Api-Key"] = key();
  if (o.body && typeof o.body !== "string") { o.body = JSON.stringify(o.body); o.headers["Content-Type"] = "application/json"; }
  let r = await fetch(path, o);
  if (r.status === 401) {
    const k = prompt("API key");
    if (k === null) throw new Error("API key required");
    saveKey(k); o.headers["X-Api-Key"] = k; r = await fetch(path, o);
  }
  return r;
}
async function json(path, opts) {
  const r = await api(path, opts);
  if (!r.ok && r.status !== 404) throw new Error(path + " answered " + r.status);
  return r.status === 404 ? null : r.json();
}
const when = (t) => t ? new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const PRIORITY = ["on demand", "recent", "backlog"];

// "/media/movies/Dunkirk (2017)/Dunkirk (2017) 4k HDR.mkv" -> name "Dunkirk (2017) 4k HDR", folder "movies / Dunkirk (2017)"
function labels(r) {
  const parts = r.path.replace(/^\/media\//, "").split("/");
  const file = parts.pop() || r.path;
  return { name: r.title || file.replace(/\.[^.]+$/, ""), dir: parts.join(" / ") };
}
function nameBlock(r) {
  const l = labels(r);
  return el("div", {}, el("div", { className: "name", textContent: l.name }), l.dir ? el("div", { className: "dir", textContent: l.dir }) : null);
}
function span(text, cls) { return el("span", { textContent: text, className: cls || "" }); }

const minutes = (s) => s < 90 ? Math.max(1, Math.round(s)) + " s" : s < 5400 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h";
function progressBlock(r) {
  const p = r.progress, elapsed = r.started_at ? Date.now() / 1000 - r.started_at : 0;
  const track = el("div", { className: "track" });
  if (!p) {
    track.append(el("div", { className: "fill wait" }));
    return el("div", {}, track, el("div", { className: "ptext muted" }, span("Starting"), span(elapsed > 0 ? minutes(elapsed) + " so far" : "")));
  }
  const pct = Math.min(99, Math.round(p.fraction * 100));
  track.append(el("div", { className: "fill", style: "width:" + pct + "%" }));
  const left = p.fraction >= 0.03 && elapsed > 60 ? " · about " + minutes(elapsed * (1 - p.fraction) / p.fraction) + " left" : "";
  return el("div", {}, track, el("div", { className: "ptext muted" },
    span(({ surveying: "Surveying", reading: "Reading the file" }[p.phase] || "Checking changes") + " · " + pct + "%"),
    span(minutes(elapsed) + " so far" + left)));
}

function runningCard(r) {
  return el("div", { className: "job" }, nameBlock(r),
    el("div", { className: "meta" }, r.priority === 0 ? el("span", { className: "chip demand", textContent: "on demand" }) : null,
      r.size ? span((r.size / 2 ** 30).toFixed(1) + " GiB") : null),
    progressBlock(r));
}
function queuedCard(r) {
  return el("div", { className: "job queued" }, nameBlock(r),
    el("div", { className: "meta" }, el("span", { className: "chip" + (r.priority === 0 ? " demand" : ""), textContent: PRIORITY[r.priority] }), span("queued " + when(r.queued_at))));
}

function fill(list, cards) { list.textContent = ""; for (const c of cards) list.append(c); }

async function refresh() {
  try {
    const s = await json("/api/v1/status");
    $("ver").textContent = "v" + s.version + " · up " + minutes(s.uptime_s);
    const c = $("cards"); c.textContent = "";
    for (const st of ["queued", "running", "done", "error", "skipped", "missing"]) {
      c.append(el("div", { className: "card" }, el("b", { textContent: String(s.counts[st] || 0), className: st === "error" && s.counts[st] ? "bad" : "" }), st));
    }
    const sc = s.scheduler;
    const wi = $("workers"); wi.max = s.settings.max_workers;
    if (!workersEdited) wi.value = sc.workers;  // never overwrite a number the user has typed and not yet applied
    $("workershint").textContent = "Raising it starts more now; lowering it lets running files finish and takes no new ones. To start nothing new, use Pause. " +
      (s.settings.concurrency_saved ? "Saved across restarts (template says " + s.settings.concurrency_env + "). " : "Using the template setting (" + s.settings.concurrency_env + "). ") +
      (s.settings.start_paused ? "The template starts the container paused." : "");
    const banner = $("pausebanner");
    banner.hidden = !sc.paused;
    if (sc.paused) {
      const why = { paused: "Paused", "quiet-hours": "Paused (quiet hours)", "plex-transcode": "Paused (Plex is transcoding)" }[sc.paused] || "Paused";
      banner.textContent = why + ". " + (sc.busy > 0
        ? "The " + sc.busy + " file(s) running below keep going until they finish. "
        : "Nothing is running. ") + "Nothing new will start" + (sc.paused === "paused" ? " until you press Resume." : " until this ends.");
    }
    armStop(sc.busy);
    $("sched").textContent = (sc.paused ? "" : "Running. ") + sc.busy + " of " + sc.workers + " worker(s) busy" +
      (sc.busy > sc.workers ? " (" + (sc.busy - sc.workers) + " finishing, then stopping)" : "") + ". " +
      (sc.last_scan ? "Last scan " + when(sc.last_scan.at) + " (" + sc.last_scan.seen + " files). " : "") +
      (s.plex.enabled ? (sc.last_plex ? (sc.last_plex.error ? "Plex: " + sc.last_plex.error : "Plex synced " + when(sc.last_plex.at) + " (" + sc.last_plex.matched + " matched).") : "Plex not synced yet.") : "Plex not configured.");

    const q = await json("/api/v1/queue?limit=" + Math.min(200, sc.workers * 2 + 20)) || [];
    const running = q.filter((r) => r.status === "running"), queued = q.filter((r) => r.status !== "running").slice(0, 12);
    fill($("running"), running.map(runningCard));
    $("runningnone").hidden = running.length > 0;
    fill($("queue"), queued.map(queuedCard));
    const rest = (s.counts.queued || 0) - queued.length;
    $("more").textContent = rest > 0 ? "and " + rest.toLocaleString() + " more queued" : "";

    const e = await json("/api/v1/errors?limit=30") || [];
    $("noerrors").hidden = e.length > 0;
    fill($("errors"), e.map((r) => {
      const b = el("button", { textContent: "Retry" }); b.onclick = () => analyze(r.path);
      return el("div", { className: "job" }, nameBlock(r), el("div", { className: "err bad", textContent: r.error || "" }), el("div", { className: "row" }, b));
    }));
    clearNote();
  } catch (err) { note(err.message, "bad"); }
}

async function analyze(path) {
  const r = await json("/api/v1/analyze", { method: "POST", body: { path } });
  note("Analysis: " + (r ? r.status : "unknown"));
  refresh();
}

function renderResults(rows) {
  fill($("results"), rows.map((r) => {
    const open = el("button", { textContent: "Open" }); open.onclick = () => { openTitle(r.path); $("detail").scrollIntoView({ behavior: "smooth" }); };
    const flags = (r.flags || "").split(",").filter(Boolean).join(" · ");
    return el("div", { className: "job" }, nameBlock(r),
      el("div", { className: "meta" }, span(r.status + (r.skip_reason ? " (" + r.skip_reason + ")" : "")),
        r.segments == null ? null : span(r.segments + (r.segments === 1 ? " segment" : " segments")), flags ? span(flags) : null),
      el("div", { className: "row" }, open));
  }));
}
async function search() { renderResults(await json("/api/v1/files?q=" + encodeURIComponent($("q").value)) || []); }

const hue = (ratio) => Math.round(((ratio - 1.2) / 1.4) * 280);
async function openTitle(path) {
  current = path;
  const t = await json("/api/v1/timeline?path=" + encodeURIComponent(path));
  $("detail").hidden = false;
  $("dtitle").textContent = path;
  const bar = $("bar"); bar.textContent = "";
  const sb = $("segs").tBodies[0]; sb.textContent = "";
  $("ramps").textContent = "";
  if (!t) { bar.append(el("div", { textContent: "No timeline yet.", className: "muted" })); return; }
  $("ovnow").textContent = t.override ? "now: " + t.override.mode : "";
  $("ovmode").value = t.override ? t.override.mode : "";
  const total = Math.max(t.video.duration, ...t.segments.map((s) => s.end), 1);
  let at = 0;
  t.segments.forEach((s, i) => {
    if (i && s.start - at > 0.001) bar.append(el("div", { className: "seg ramp", style: "width:" + ((s.start - at) / total * 100) + "%", title: "ramp" }));
    const d = s.end - s.start;
    bar.append(el("div", { className: "seg", style: "width:" + (d / total * 100) + "%;background:hsl(" + hue(s.aspect) + ",55%,38%)", title: s.aspect.toFixed(2) + " from " + s.start.toFixed(2) + " s", textContent: d / total > 0.06 ? s.aspect.toFixed(2) : "" }));
    at = s.end;
    sb.append(el("tr", {}, el("td", { textContent: s.start.toFixed(3) }), el("td", { textContent: s.end.toFixed(3) }), el("td", { textContent: s.aspect.toFixed(3) + (s.preset ? " (" + s.preset.toFixed(2) + ")" : "") }), el("td", { textContent: [s.active.x, s.active.y, s.active.w, s.active.h].join(" ") }), el("td", { textContent: s.boundary.kind + " @ frame " + s.boundary.frame + (s.boundary.scene_cut === false ? " (no scene change)" : "") })));
  });
  const rp = await json("/api/v1/ramp?path=" + encodeURIComponent(path));
  for (const r of (rp ? rp.ramps : [])) $("ramps").append(plot(r));
}

function plot(r) {
  // one panel per edge, each scaled to its own stored curve, so a slow ramp is visible and a flash frame measured
  // far off cannot squash it (such a point is pinned to the panel's edge)
  const W = 800, PH = 170, P = 34, ns = "http://www.w3.org/2000/svg";
  const fr = r.frames, n = fr.length, edges = ["top", "bottom"];
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + (PH * edges.length + 24));
  const add = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.append(e); };
  const x = (i) => P + (n > 1 ? i / (n - 1) : 0) * (W - 2 * P);
  add("text", { x: P, y: 14, fill: "currentColor", "font-size": 12 }, "Ramp, frame " + r.start_frame + " to " + r.end_frame + " (confidence " + r.confidence + ")");
  edges.forEach((edge, k) => {
    const top = 24 + k * PH, vals = fr.map((f) => f[edge]);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, 1);
    const y = (v) => top + PH - P - (Math.min(hi + span * 0.05, Math.max(lo - span * 0.05, v)) - lo) / span * (PH - P - 14);
    add("polyline", { fill: "none", stroke: "#1c6ed5", "stroke-width": 1.6, points: fr.map((f, i) => x(i) + "," + y(f[edge])).join(" ") });
    fr.forEach((f, i) => { if (f.raw) add("circle", { cx: x(i), cy: y(f.raw[edge]), r: 1.8, fill: f.readable ? "#888" : "#d33" }); });
    add("text", { x: P, y: top + PH - 14, fill: "currentColor", "font-size": 11 }, edge + " edge, rows " + Math.round(lo) + " to " + Math.round(hi) + "   line: stored (fitted)   grey: measured   red: set aside as a misread");
  });
  return svg;
}
$("go").onclick = search; $("q").onkeydown = (e) => { if (e.key === "Enter") search(); };
$("vars").onclick = async () => renderResults(await json("/api/v1/files?var=1&limit=200") || []);
$("pause").onclick = async () => {
  const r = await json("/api/v1/pause", { method: "POST" });
  await refresh();
  note(r.running > 0
    ? "Paused. The " + r.running + " running file(s) will finish; nothing new will start until you press Resume."
    : "Paused. Nothing is running; nothing will start until you press Resume.", "warn", 10);
};
$("resume").onclick = async () => {
  await json("/api/v1/resume", { method: "POST" });
  await refresh();
  note("Resumed. New files start within about 15 seconds.", "ok", 8);
};

// Stop now kills work in progress, so it takes two clicks: the first arms it (and says what it will do), the second,
// within 6 seconds, does it. Anything else disarms it.
let stopArmedUntil = 0, stopTimer = null;
function disarmStop() { stopArmedUntil = 0; clearTimeout(stopTimer); const b = $("stop"); b.classList.remove("armed"); b.textContent = "Stop now"; }
function armStop(busy) { if (stopArmedUntil && busy === 0) disarmStop(); }
$("stop").onclick = async () => {
  if (Date.now() < stopArmedUntil) {
    disarmStop();
    try {
      const r = await json("/api/v1/stop-now", { method: "POST" });
      await refresh();
      note(r.stopped > 0
        ? "Stopped " + r.stopped + " file(s). They are back in the queue and start over after Resume. Analysis is paused."
        : "Nothing was running. Analysis is paused.", "warn", 12);
    } catch (e) { note("Could not stop: " + e.message, "bad", 8); }
    return;
  }
  stopArmedUntil = Date.now() + 6000;
  $("stop").classList.add("armed");
  $("stop").textContent = "Click again to kill running files";
  note("This kills the files being analysed; their progress is lost and they start over. Click Stop now again within 6 seconds to confirm.", "warn", 6);
  stopTimer = setTimeout(disarmStop, 6000);
};
$("scan").onclick = async () => { await json("/api/v1/scan", { method: "POST" }); note("Scan started"); };
$("plex").onclick = async () => { try { await json("/api/v1/plex-sync", { method: "POST" }); note("Plex sync started"); } catch (e) { note(e.message, "bad"); } };
$("workers").oninput = () => { workersEdited = true; };
$("setworkers").onclick = async () => {
  const raw = $("workers").value.trim(), n = Number(raw), max = Number($("workers").max) || 16;
  if (raw === "" || !Number.isInteger(n) || n < 0 || n > max) {
    note("Enter a whole number from 0 to " + max + ".", "bad", 8);
    return;  // the typed value stays, so it can be corrected
  }
  try {
    const r = await json("/api/v1/concurrency", { method: "POST", body: { workers: n } });
    workersEdited = false;
    await refresh();
    note(r.workers === 0 ? "No new files will start; the ones running will finish." : "Analysing " + r.workers + " file(s) at once.", "ok", 8);
  } catch (e) { note("Could not change the count: " + e.message, "bad", 8); }
};
$("resetworkers").onclick = async () => {
  try {
    const r = await json("/api/v1/concurrency", { method: "DELETE" });
    workersEdited = false;
    await refresh();
    note("Back to the template setting: " + r.workers + " file(s) at once.", "ok", 8);
  } catch (e) { note("Could not change the count: " + e.message, "bad", 8); }
};
$("reanalyze").onclick = () => current && analyze(current);
$("ovsave").onclick = async () => {
  if (!current) return;
  const mode = $("ovmode").value;
  await json("/api/v1/override", { method: "POST", body: mode ? { path: current, mode } : { path: current, mode: "clear" } });
  openTitle(current);
};
refresh(); setInterval(refresh, 5000);
</script>
</body>
